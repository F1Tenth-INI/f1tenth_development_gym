name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      ACADOS_COMMIT: 5b74695a51c09637664318f7c9b2f1ee2efa05b7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Python Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Upgrade pip and build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install sim
        run: python -m pip install -e sim/

      - name: Check submodules
        run: |
          if [ -z "$(ls -A SI_Toolkit)" ] || [ -z "$(ls -A Control_Toolkit)" ]; then
            git submodule update --init --recursive
          fi

      - name: Install SI_Toolkit (from workspace)
        run: |
          # Editable installs fail because SI_Toolkit pins setuptools<PEP660;
          # installing the wheel still uses the repo copy checked out above.
          python -m pip install ./SI_Toolkit

      - name: Cache acados
        id: cache-acados
        uses: actions/cache@v4
        with:
          path: ~/acados
          key: ${{ runner.os }}-acados-${{ env.ACADOS_COMMIT }}

      - name: Build acados
        if: steps.cache-acados.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/acados/acados.git ~/acados
          cd ~/acados
          git checkout "$ACADOS_COMMIT"
          git submodule update --init --recursive
          mkdir -p build && cd build
          cmake .. -DACADOS_WITH_QPOASES=OFF -DACADOS_WITH_OPENMP=OFF
          make install -j"$(nproc)"

      - name: Install acados Python interface
        run: |
          python -m pip install -e ~/acados/interfaces/acados_template
          echo "ACADOS_SOURCE_DIR=$HOME/acados" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$HOME/acados/lib" >> $GITHUB_ENV

      - name: Add project root to PYTHONPATH
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Run simulation
        run: python run/ci_test.py
        env:
          CI_TEST: true

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: ExperimentRecordings
          path: ExperimentRecordings/
          if-no-files-found: ignore
